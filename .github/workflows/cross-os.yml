name: Cross-OS Verification

# Non-blocking: runs the full gate on macOS and Windows weekly so OS-specific regressions
# surface without slowing every PR. Not a required check.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Generate environments/local.env from repository variables. Every value is
      # inlined into the public browser bundle, so only public keys are mapped and
      # no secret is ever passed to the build (see AGENTS.md section 8).
      - name: Generate build environment
        env:
          BUILD_ENV: local
          baseProdURL: ${{ vars.BASE_PROD_URL }}
          baseTestURL: ${{ vars.BASE_TEST_URL }}
          tokenProdUrl: ${{ vars.TOKEN_PROD_URL }}
          tokenTestUrl: ${{ vars.TOKEN_TEST_URL }}
          llmProdUrl: ${{ vars.LLM_PROD_URL }}
          llmTestUrl: ${{ vars.LLM_TEST_URL }}
          keycloakProdUrl: ${{ vars.KEYCLOAK_PROD_URL }}
          keycloakTestUrl: ${{ vars.KEYCLOAK_TEST_URL }}
          profanityUrl: ${{ vars.PROFANITY_URL }}
          profanityRegion: ${{ vars.PROFANITY_REGION }}
          googleTranslateUrl: ${{ vars.GOOGLE_TRANSLATE_URL }}
          googleAnalyticsMeasurementId: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          enableGoogleAnalytics: ${{ vars.ENABLE_GOOGLE_ANALYTICS }}
        run: npm run env:generate

      - name: Build
        run: npm run build
