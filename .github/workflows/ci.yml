name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']

permissions:
  contents: read

# Superseded PR runs are cancelled; pushes to protected branches always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which heavy jobs are needed. Skipping is done at job level (not with workflow
  # `paths-ignore`) so the required `CI Gate` check always reports.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      deps: ${{ steps.diff.outputs.deps }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          code=true
          deps=true
          files=""
          if [[ "$EVENT" == "pull_request" ]]; then
            files=$(git diff --name-only "$PR_BASE...$PR_HEAD") || files=""
          elif [[ "$EVENT" == "push" ]] && [[ ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            files=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER") || files=""
          fi

          # Unknown or empty diff: run everything.
          if [[ -n "$files" ]]; then
            # Only these paths may be skipped; everything else (config, scripts, tests,
            # workflows, lockfile) runs the full gate.
            if ! grep -v -E '^(.*\.md|artefacts/.*|LICENSE|CHANGELOG\.md)$' <<< "$files" | grep -q .; then
              code=false
            fi
            if ! grep -q -E '^(package\.json|package-lock\.json)$' <<< "$files"; then
              deps=false
            fi
          fi

          # Audit always runs for pushes to main (post-merge / release baseline).
          if [[ "$EVENT" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            deps=true
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "deps=$deps" >> "$GITHUB_OUTPUT"
          echo "code=$code deps=$deps"
          echo "$files"

  verify:
    name: Build, Check, and Verify
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # Restored after `npm ci`, which deletes node_modules (and its .cache directory).
      - name: Restore webpack and Jest caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            node_modules/.cache/webpack
            .jest-cache
          key: build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            build-cache-${{ runner.os }}-

      # --- Blocking gates ---
      # Independent static checks run concurrently; any failure fails the step.
      - name: Type check, format check, and lint
        run: |
          npm run typecheck & p_types=$!
          npm run format:check & p_format=$!
          npm run lint & p_lint=$!
          rc=0
          wait "$p_types" || { echo "::error::typecheck failed"; rc=1; }
          wait "$p_format" || { echo "::error::format:check failed"; rc=1; }
          wait "$p_lint" || { echo "::error::lint failed"; rc=1; }
          exit "$rc"

      - name: Tests
        run: npm test -- --ci --maxWorkers=100%

      # Generate environments/local.env from repository variables. Every value is
      # inlined into the public browser bundle, so only public keys are mapped and
      # no secret is ever passed to the build (see AGENTS.md section 8).
      - name: Generate build environment
        env:
          BUILD_ENV: local
          baseProdURL: ${{ vars.BASE_PROD_URL }}
          baseTestURL: ${{ vars.BASE_TEST_URL }}
          tokenProdUrl: ${{ vars.TOKEN_PROD_URL }}
          tokenTestUrl: ${{ vars.TOKEN_TEST_URL }}
          llmProdUrl: ${{ vars.LLM_PROD_URL }}
          llmTestUrl: ${{ vars.LLM_TEST_URL }}
          keycloakProdUrl: ${{ vars.KEYCLOAK_PROD_URL }}
          keycloakTestUrl: ${{ vars.KEYCLOAK_TEST_URL }}
          profanityUrl: ${{ vars.PROFANITY_URL }}
          profanityRegion: ${{ vars.PROFANITY_REGION }}
          googleTranslateUrl: ${{ vars.GOOGLE_TRANSLATE_URL }}
          googleAnalyticsMeasurementId: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          enableGoogleAnalytics: ${{ vars.ENABLE_GOOGLE_ANALYTICS }}
        run: npm run env:generate

      - name: Build
        run: npm run build

      # Fails if a secret key has a value or appears in the bundle. Empty PROD URL
      # defaults fail on release candidates (PRs into main, pushes to main) and
      # only warn elsewhere, so PRs into dev stay green until the repository
      # variables exist.
      - name: Check URL defaults and secrets
        env:
          BUILD_ENV: local
          STRICT_URLS: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: |
          if [[ "$STRICT_URLS" == "true" ]]; then
            node scripts/ci/check-build-env.mjs
          else
            node scripts/ci/check-build-env.mjs --allow-empty-urls
          fi

  # Builds the production bundle, packs it as a release would and checks the
  # tarball (scripts/ci/pack-check.sh). The tarball is kept as artifact
  # `sdk-tarball` for 30 days, so a Client build can be tried against exactly
  # these bytes. It is a CI build of this commit, not a release.
  pack:
    name: Pack and check tarball
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      # Same keys as the release build (public values only; see verify).
      - name: Generate production environment
        env:
          BUILD_ENV: production
          baseProdURL: ${{ vars.BASE_PROD_URL }}
          baseTestURL: ${{ vars.BASE_TEST_URL }}
          tokenProdUrl: ${{ vars.TOKEN_PROD_URL }}
          tokenTestUrl: ${{ vars.TOKEN_TEST_URL }}
          llmProdUrl: ${{ vars.LLM_PROD_URL }}
          llmTestUrl: ${{ vars.LLM_TEST_URL }}
          keycloakProdUrl: ${{ vars.KEYCLOAK_PROD_URL }}
          keycloakTestUrl: ${{ vars.KEYCLOAK_TEST_URL }}
          profanityUrl: ${{ vars.PROFANITY_URL }}
          profanityRegion: ${{ vars.PROFANITY_REGION }}
          googleTranslateUrl: ${{ vars.GOOGLE_TRANSLATE_URL }}
          googleAnalyticsMeasurementId: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          enableGoogleAnalytics: ${{ vars.ENABLE_GOOGLE_ANALYTICS }}
        run: npm run env:generate

      - name: Build (production)
        run: |
          npm run clean
          npm run build:prod

      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          tarball="$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/pack" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      # Same strictness as the verify job's check: empty PROD URL defaults fail on
      # release candidates and warn elsewhere; secrets always fail.
      - name: Check the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          STRICT_URLS: ${{ github.base_ref == 'main' || github.ref == 'refs/heads/main' }}
        run: |
          args=(--env=production)
          [[ "$STRICT_URLS" == "true" ]] || args+=(--allow-empty-urls)
          scripts/ci/pack-check.sh "${args[@]}" "$RUNNER_TEMP/pack/$TARBALL"

      - name: Checksums and summary
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cd "$RUNNER_TEMP/pack"
          sha256sum "$TARBALL" > SHA256SUMS
          integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          {
            echo "### SDK tarball (CI build of \`${COMMIT:0:7}\`, not a release)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$TARBALL\` (artifact \`sdk-tarball\`, 30 days) |"
            echo "| SHA256 | \`$(cut -d' ' -f1 SHA256SUMS)\` |"
            echo "| npm integrity | \`$integrity\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-tarball
          path: |
            ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/pack/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  audit:
    name: Dependency Audit
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # npm audit reads package-lock.json; no install needed.
      - name: Audit Dependencies
        run: npm run security

  # Single required status check for the rulesets. Skipped jobs (docs-only change, no
  # dependency change) count as success; failed or cancelled jobs fail the gate.
  gate:
    name: CI Gate
    needs: [changes, verify, pack, audit]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "::error::A required job did not succeed ($r)."
              exit 1
            fi
          done
