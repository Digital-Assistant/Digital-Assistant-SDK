name: Enforce Dev to Main Pull Request

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-source-branch:
    name: Check source branch
    runs-on: ubuntu-latest
    steps:
      - name: Check if pull request source is 'dev'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Target branch is: $BASE_REF"
          echo "Source branch is: $HEAD_REF"
          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "Automated Release Please PR - validation skipped."
            exit 0
          fi
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::Direct PRs to 'main' must only originate from the 'dev' branch. Please merge your branch to 'dev' first, then create a PR from 'dev' to 'main'."
            exit 1
          fi
          echo "Validation successful!"
