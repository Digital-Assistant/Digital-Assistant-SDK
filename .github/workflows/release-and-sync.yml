name: Release & Sync

on:
  push:
    branches:
      - main # Releases only happen when code is merged into main

permissions:
  contents: write
  pull-requests: write

# PRs opened with GITHUB_TOKEN do not trigger workflows, so required checks never
# report on them. Release PRs and back-merge PRs are therefore opened with a
# GitHub App installation token (repo variable RELEASE_APP_ID, secret
# RELEASE_APP_PRIVATE_KEY). See RELEASE_PROCESS.md.

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  back-merge:
    name: Automate Back-Merge
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Create Back-Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base dev \
            --head main \
            --title "chore: sync main back to dev after release" \
            --body "Automated PR: syncs the updated package.json and CHANGELOG.md from main back to dev after a release. Merge this immediately to prevent future merge conflicts." \
            || echo "Back-merge PR not created (already exists or nothing to sync)."

  # Publishes the release to npm via Trusted Publishing (GitHub OIDC, no token).
  # npmjs.com -> @udan/digital-assistant-sdk -> Settings -> Trusted Publisher is
  # configured for this repo, workflow 'release-and-sync.yml', environment
  # 'production'. Publishes are staged: a maintainer approves them on npmjs.com.
  #
  # Build-time keys are the public TEST and PROD URL defaults from repository
  # variables; the page picks the environment at runtime. No secret is passed.
  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      # `npm stage publish` needs npm >= 11.21.
      - name: Update npm
        run: npm install -g npm@^11.21.0

      - name: Install Dependencies
        run: npm ci

      - name: Generate production environment
        env:
          BUILD_ENV: production
          baseProdURL: ${{ vars.BASE_PROD_URL }}
          baseTestURL: ${{ vars.BASE_TEST_URL }}
          tokenProdUrl: ${{ vars.TOKEN_PROD_URL }}
          tokenTestUrl: ${{ vars.TOKEN_TEST_URL }}
          llmProdUrl: ${{ vars.LLM_PROD_URL }}
          llmTestUrl: ${{ vars.LLM_TEST_URL }}
          keycloakProdUrl: ${{ vars.KEYCLOAK_PROD_URL }}
          keycloakTestUrl: ${{ vars.KEYCLOAK_TEST_URL }}
          keycloakRealm: ${{ vars.KEYCLOAK_REALM }}
          keycloakClientId: ${{ vars.KEYCLOAK_CLIENT_ID }}
          profanityUrl: ${{ vars.PROFANITY_URL }}
          profanityRegion: ${{ vars.PROFANITY_REGION }}
          googleTranslateUrl: ${{ vars.GOOGLE_TRANSLATE_URL }}
          googleAnalyticsMeasurementId: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          enableGoogleAnalytics: ${{ vars.ENABLE_GOOGLE_ANALYTICS }}
        run: npm run env:generate

      # Build here so the check below sees the bundle; prepublishOnly rebuilds it
      # from the same environment file.
      - name: Build (production)
        run: npm run build:prod

      # Never publish without URL defaults or with a secret in the bundle.
      - name: Check URL defaults and secrets
        run: node scripts/ci/check-build-env.mjs --env=production

      # The trusted publisher allows staged publishes only; a maintainer approves the
      # staged version on npmjs.com. prepublishOnly runs check, clean and build:prod.
      - name: Stage publish to npm
        run: npm stage publish --provenance --access public
