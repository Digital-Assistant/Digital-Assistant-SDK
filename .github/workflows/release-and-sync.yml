name: Release & Sync

on:
  push:
    branches:
      - main # Releases only happen when code is merged into main

permissions:
  contents: write
  pull-requests: write

# PRs opened with GITHUB_TOKEN do not trigger workflows, so required checks never
# report on them. Release PRs and back-merge PRs are therefore opened with a
# GitHub App installation token (repo variable RELEASE_APP_ID, secret
# RELEASE_APP_PRIVATE_KEY). See RELEASE_PROCESS.md.

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  back-merge:
    name: Automate Back-Merge
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create Back-Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base dev \
            --head main \
            --title "chore: sync main back to dev after release" \
            --body "Automated PR: syncs the updated package.json and CHANGELOG.md from main back to dev after a release. Merge this immediately to prevent future merge conflicts." \
            || echo "Back-merge PR not created (already exists or nothing to sync)."

  # Publishes the release to npm via Trusted Publishing (GitHub OIDC, no token).
  # npmjs.com -> @udan/digital-assistant-sdk -> Settings -> Trusted Publisher is
  # configured for this repo, workflow 'release-and-sync.yml', environment
  # 'production'. Publishes are staged: a maintainer approves them on npmjs.com.
  #
  # Build-time keys are intentionally empty: host applications pass runtime
  # configuration, and nothing secret is inlined into the public bundle.
  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      # Trusted Publishing needs npm >= 11.5.1.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install Dependencies
        run: npm ci

      - name: Generate production environment
        env:
          BUILD_ENV: production
        run: npm run env:generate

      # prepublishOnly runs check, clean and build:prod.
      - name: Publish to npm
        run: npm publish --provenance --access public
