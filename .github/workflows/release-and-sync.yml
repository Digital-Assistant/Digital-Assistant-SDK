  #   1. Make sure the package exists on npm (one-time manual first publish).
  #   2. Configure npm Trusted Publishing for owner 'Digital-Assistant',
  #      repository 'Digital-Assistant-SDK', workflow 'release-and-sync.yml'
  #      (npmjs.com -> package -> Settings -> Trusted Publishing). No NPM_TOKEN
  #      is required; the job authenticates via GitHub OIDC (id-token: write).
  #   3. Create a GitHub Environment named 'production' with the build-time
  #      variables/secrets (see environments/local.env.example). Every value is
