name: Release & Sync

on:
  push:
    branches:
      - main # Releases only happen when code is merged into main

# No workflow-level permissions: each job asks for what it needs.
permissions: {}

# PRs opened with GITHUB_TOKEN do not trigger workflows, so required checks never
# report on them. Release PRs and back-merge PRs are therefore opened with a
# GitHub App installation token (repo variable RELEASE_APP_ID, secret
# RELEASE_APP_PRIVATE_KEY), scoped per job to the permissions it needs.
# See RELEASE_PROCESS.md.
#
# Build once: the `pack` job builds and packs the release tag exactly once. The
# same tarball is attached to the GitHub release (`attach`) and staged on npm
# with the dist-tag `next` (`publish`). After a Client TEST pass, a maintainer
# moves `latest` to it (RELEASE_PROCESS.md, "Promotion and rollback").

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # Release Please writes the version bump and CHANGELOG (contents), opens the
      # Release PR (pull-requests) and manages the autorelease labels (issues).
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  back-merge:
    name: Automate Back-Merge
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create Back-Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr create \
            --base dev \
            --head main \
            --title "chore: sync main back to dev after release" \
            --body "Automated PR: syncs the updated package.json and CHANGELOG.md from main back to dev after a release. Merge this immediately to prevent future merge conflicts." \
            || echo "Back-merge PR not created (already exists or nothing to sync)."

  # Builds the release tag once and packs it. Lifecycle scripts do not run for a
  # tarball publish, and `npm pack` skips prepublishOnly, so check and build run
  # explicitly here. No npm cache in release jobs (cache poisoning).
  #
  # Build-time keys are the public TEST and PROD URL defaults from the
  # organization-level Actions variables; the page picks the environment at
  # runtime. No secret is passed.
  pack:
    name: Build and pack
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - name: Checkout Release Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm ci

      - name: Generate production environment
        env:
          BUILD_ENV: production
          baseProdURL: ${{ vars.BASE_PROD_URL }}
          baseTestURL: ${{ vars.BASE_TEST_URL }}
          tokenProdUrl: ${{ vars.TOKEN_PROD_URL }}
          tokenTestUrl: ${{ vars.TOKEN_TEST_URL }}
          llmProdUrl: ${{ vars.LLM_PROD_URL }}
          llmTestUrl: ${{ vars.LLM_TEST_URL }}
          keycloakProdUrl: ${{ vars.KEYCLOAK_PROD_URL }}
          keycloakTestUrl: ${{ vars.KEYCLOAK_TEST_URL }}
          keycloakRealm: ${{ vars.KEYCLOAK_REALM }}
          keycloakClientId: ${{ vars.KEYCLOAK_CLIENT_ID }}
          profanityUrl: ${{ vars.PROFANITY_URL }}
          profanityRegion: ${{ vars.PROFANITY_REGION }}
          googleTranslateUrl: ${{ vars.GOOGLE_TRANSLATE_URL }}
          googleAnalyticsMeasurementId: ${{ vars.GOOGLE_ANALYTICS_MEASUREMENT_ID }}
          enableGoogleAnalytics: ${{ vars.ENABLE_GOOGLE_ANALYTICS }}
        run: npm run env:generate

      # What prepublishOnly used to do: check, clean, build:prod.
      - name: Check (format, types, tests)
        run: npm run check

      - name: Build (production)
        run: |
          npm run clean
          npm run build:prod

      # Never ship without URL defaults or with a secret in the bundle.
      - name: Check URL defaults and secrets
        run: node scripts/ci/check-build-env.mjs --env=production

      - name: Pack once
        id: pack
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          tarball="$(npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/release" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
          packed_version="$(tar -xzOf "$RUNNER_TEMP/release/$tarball" package/package.json | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).version)')"
          if [[ "$packed_version" != "$VERSION" ]]; then
            echo "::error::Packed version $packed_version does not match the release version $VERSION."
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Check the tarball
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: scripts/ci/pack-check.sh --env=production "$RUNNER_TEMP/release/$TARBALL"

      - name: Checksums and summary
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd "$RUNNER_TEMP/release"
          sha256sum "$TARBALL" > SHA256SUMS
          integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | base64 -w0)"
          {
            echo "### SDK release tarball ($TAG)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`$TARBALL\` |"
            echo "| SHA256 | \`$(cut -d' ' -f1 SHA256SUMS)\` |"
            echo "| npm integrity | \`$integrity\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-release-tarball
          path: |
            ${{ runner.temp }}/release/${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  # Attaches the packed tarball and its checksum to the GitHub release. Runs no
  # project code, so it is the only job with contents: write.
  attach:
    name: Attach tarball to the GitHub release
    needs: [release-please, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read # download this run's sdk-release-tarball artifact
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-release-tarball
          path: release

      # An existing asset is kept only if it has the same bytes (job re-run);
      # release assets are never replaced.
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          TARBALL: ${{ needs.pack.outputs.tarball }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qxF SHA256SUMS; then
            gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O existing.sha256
            if ! cmp -s existing.sha256 SHA256SUMS; then
              echo "::error::Release $TAG already has different assets. Not replacing them."
              exit 1
            fi
            echo "Release $TAG already has these assets."
          else
            gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "$TARBALL" SHA256SUMS
          fi

  # Stages the same tarball on npm via Trusted Publishing (GitHub OIDC, no
  # token) with the dist-tag `next`. npmjs.com -> @udan/digital-assistant-sdk ->
  # Settings -> Trusted publishing is configured for this repo, workflow
  # 'release-and-sync.yml', environment 'production'. A maintainer approves the
  # staged version on npmjs.com. Runs no project code: no checkout, no npm ci.
  publish:
    name: Stage on npm (tag next)
    needs: [release-please, pack, attach]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      id-token: write
      contents: read
      actions: read # download this run's sdk-release-tarball artifact
    steps:
      - name: Download tarball artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdk-release-tarball
          path: release

      # The bytes staged on npm must be the bytes on the GitHub release.
      - name: Verify the tarball against the release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cd release
          sha256sum -c SHA256SUMS
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O release-asset.sha256
          cmp SHA256SUMS release-asset.sha256

      - name: Setup Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # `npm stage publish` and OIDC dist-tags need npm >= 11.21. Exact version,
      # run straight from its registry tarball after an integrity check: no
      # unpinned global install, nothing else on the runner changes.
      # A staged tag cannot be changed later: if it is wrong, reject the stage on
      # npmjs.com and stage again. --provenance links the package to this run.
      - name: Stage publish to npm (npm 11.21.0)
        env:
          NPM_VERSION: 11.21.0
          NPM_INTEGRITY: sha512-Zov8KhamNneiLdELtj5YALtNmJW4L4fCLTzjfpzXG2w6MSHcf0UxgdlK5uloCuksWT+7mGUU7wi79cO6RqivPg==
          TARBALL: ${{ needs.pack.outputs.tarball }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/npm-$NPM_VERSION.tgz" "https://registry.npmjs.org/npm/-/npm-$NPM_VERSION.tgz"
          actual="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/npm-$NPM_VERSION.tgz" | base64 -w0)"
          if [[ "$actual" != "$NPM_INTEGRITY" ]]; then
            echo "::error::npm $NPM_VERSION tarball integrity mismatch."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/npm"
          tar -xzf "$RUNNER_TEMP/npm-$NPM_VERSION.tgz" -C "$RUNNER_TEMP/npm" --strip-components=1
          NPM_CLI="$RUNNER_TEMP/npm/bin/npm-cli.js"
          test "$(node "$NPM_CLI" --version)" = "$NPM_VERSION"
          node "$NPM_CLI" stage publish "./release/$TARBALL" --tag next --provenance --access public
          {
            echo "### Staged on npm with tag \`next\`"
            echo ""
            echo "1. Approve the staged version on npmjs.com (or \`npm stage approve\`)."
            echo "2. Build the Client against \`@udan/digital-assistant-sdk@$VERSION\` and deploy it to TEST."
            echo "3. After the TEST pass: \`npm dist-tag add @udan/digital-assistant-sdk@$VERSION latest\`."
          } >> "$GITHUB_STEP_SUMMARY"
