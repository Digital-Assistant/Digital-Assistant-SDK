name: Security Audit

# Scheduled audit so newly published advisories surface without waiting for a PR.
# PR/push audits run as the `audit` job in ci.yml (only when dependencies change).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Scheduled Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      # npm audit reads package-lock.json; no install needed.
      - name: Audit Dependencies
        run: npm run security
