name: Security Audit

# Scheduled audit so newly published advisories surface without waiting for a PR.
# PR/push audits run as the `audit` job in ci.yml (only when dependencies change).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Scheduled Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # npm audit reads package-lock.json; no install needed.
      - name: Audit Dependencies
        run: npm run security
