version: 2
# Versions are locked (lockfiles). Routine version PRs are off for every ecosystem
# (open-pull-requests-limit: 0); security updates still arrive (they need "Dependabot
# security updates" on in the repo settings) and use the commit prefix below so the PR
# title passes pr-title. No entry sets target-branch: security updates always go to the
# default branch (dev), and a target-branch would make them ignore these options. Bump everything
# by hand in a planned window every 3 to 6 months: update everything, run scripts/ci locally,
# then Deploy to TEST.
updates:
  # Actions are pinned by SHA. Security updates only, like npm: bump the pins by hand in
  # the planned window.
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: quarterly
    # Cooldown applies to version updates only (zizmor dependabot-cooldown); security
    # updates are never delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: 'build'
  # The pack-check tools (publint, attw) have their own lockfile. Security updates only,
  # like the root package; grouped so a security batch is one PR.
  - package-ecosystem: npm
    directory: /scripts/ci/pack-tools
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: 'build'
